<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apple Card Layout</title>
    <link rel="icon" href="./favicon/apple-favicon.svg" />
    <link rel="apple-touch-icon" href="./favicon/apple-favicon.svg" />
    <link href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT/fonts/variable/woff2/SUIT-Variable.css" rel="stylesheet" />
    <link rel="stylesheet" href="./styles/apple.css" />
  </head>
  <body>
    <h1 class="sr-only">Apple Card Layout</h1>
    <!-- 카드 레이아웃 -->
    <header>
      <nav class="menubar">
        <button type="button" class="menuLogo"><img src="./favicon/apple-favicon.svg" style="width: 12px; height: 12px" alt="애플로고" class="logoApple" /></button>
        <button type="button">스토어</button>
        <button type="button">Mac</button>
        <button type="button">iPad</button>
        <button type="button">iPhone</button>
        <button type="button">Watch</button>
        <button type="button">Vision</button>
        <button type="button">AirPods</button>
        <button type="button">TV 및 홈</button>
        <button type="button">엔터테인먼트</button>
        <button type="button">액세서리</button>
        <button type="button" class="menuCS">고객지원</button>
        <button type="button" class="menuSearch"><img src="./favicon/search.svg" style="width: 12px; height: 12px" alt="검색" class="logoSearch" /></button>
        <button type="button" class="menuShop"><img src="./icon/shoppingbag.ico" style="width: 12px; height: 12px" alt="장바구니" class="logoShoppingCart" /></button>
        <button type="button" class="menuAll"><img src="./favicon/allmenu.svg" style="width: 12px; height: 12px" alt="전체메뉴" /></button>
      </nav>
    </header>
    <main class="productList">
      <section class="iPadPro">
        <h2>iPad Pro</h2>
        <div class="iPadProInfo">
          <p>놀라우리만치 얇다.</p>
          <p>엄청나게 강력하다.</p>
        </div>
        <p class="release">출시일 추후 공개</p>
        <div class="btn">
          <button type="button" class="more">더 알아보기</button>
          <button type="button" class="shopping">가격보기</button>
        </div>
      </section>
      <section class="iPadAir">
        <h2>iPad Air</h2>
        <div class="iPadAirInfo">
          <p>두 가지 사이즈. 더 빠른 칩.</p>
          <p>무엇이든 거뜬하게.</p>
        </div>
        <p class="release">출시일 추후 공개</p>
        <div class="btn">
          <button type="button" class="more">더 알아보기</button>
          <button type="button" class="shopping">가격보기</button>
        </div>
      </section>
      <section class="iPhonePro">
        <h2>iPhone 15 Pro</h2>
        <div class="iPhoneProInfo">
          <p>티타늄. 초강력. 초경량. 초프로.</p>
        </div>
        <div class="btn">
          <button type="button" class="more">더 알아보기</button>
          <button type="button" class="shopping">가격보기</button>
        </div>
      </section>
      <div class="bottomLayout">
        <section class="iPhone">
          <h2>iPhone 15</h2>
          <div class="iPhoneInfo">
            <p>새로운 카메라.</p>
            <p>새로운 디자인.</p>
            <p>새로움이 물씬.</p>
          </div>
          <div class="btn">
            <button type="button" class="more">더 알아보기</button>
            <button type="button" class="shopping">가격보기</button>
          </div>
        </section>
        <section class="watch">
          <h2>WATCH</h2>
          <div class="watchInfo">
            <p>보다 똑똑. 보다 또렷. 보다 강력.</p>
          </div>
          <div class="btn">
            <button type="button" class="more">더 알아보기</button>
            <button type="button" class="shopping">가격보기</button>
          </div>
        </section>
        <section class="macBookAir">
          <h2>MacBook Air</h2>
          <div class="macBookAirInfo">
            <p>날렵하게. 강력하게. M3답게.</p>
          </div>
          <div class="btn">
            <button type="button" class="more">더 알아보기</button>
            <button type="button" class="shopping">가격보기</button>
          </div>
        </section>
        <section class="airPodsPro">
          <h2>airPods Pro</h2>
          <div class="airPodsProInfo">
            <p>전에 없던 청취 경험.</p>
            <p>적응형 오디오.</p>
          </div>
          <div class="btn">
            <button type="button" class="more">더 알아보기</button>
            <button type="button" class="shopping">가격보기</button>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
